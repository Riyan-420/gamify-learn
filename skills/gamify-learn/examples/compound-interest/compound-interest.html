/* gamify-learn engine · retro game theme: light-blue sky + red.  Fonts are injected by build.py (@font-face). */
:root{
  --sky1:#7cc4f5;--sky2:#9fd8ff;--sky3:#c4e8ff;--sky4:#e3f4ff;
  --red:#e63946;--red2:#a4161a;--red3:#ff9aa0;--red4:#ffe3e5;
  --blue:#2a9df4;--blue2:#bfe6ff;--navy:#1d3557;
  --cream:#fff8ea;--paper:#fffdf6;--ink:#12213f;--ink2:#40527a;--mut:#5a6b8f;
  --ok:#1a9a5f;--ok2:#d8f5e6;--gold:#ffd23f;
  --k0:#e63946;--k1:#1f7fd1;--k2:#a4161a;--k3:#0e9bb8;--k4:#d9552b;--k5:#1d3557;
  --px:'Press Start 2P','Courier New',monospace;
  --body:'VT323','Courier New',monospace;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  --u:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:var(--body);font-size:clamp(23px,2.1vw,28px);line-height:1.18;color:var(--ink);min-height:100vh;
  background:linear-gradient(var(--sky1) 0 16%,var(--sky2) 16% 38%,var(--sky3) 38% 62%,var(--sky4) 62%) fixed;
  padding:0 0 170px;overflow-x:hidden;image-rendering:pixelated;
}
button,input,textarea,select{font:inherit;color:inherit}
b,strong{font-weight:400;color:var(--red2);background:linear-gradient(transparent 62%,var(--red4) 62%)}
mark{background:var(--gold);color:var(--ink);padding:0 3px}
code,.mono{font-family:var(--mono);font-size:.82em;background:var(--ink);color:var(--cream);padding:1px 6px}
sup,sub{font-size:.6em;line-height:0}
a{color:var(--blue)}
:focus-visible{outline:4px dashed var(--red);outline-offset:3px}

/* sky + floor */
.cloud{position:fixed;z-index:0;width:12px;height:12px;background:#fff;pointer-events:none;
  box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,-12px 12px #fff,0 12px #fff,12px 12px #fff,24px 12px #fff,36px 12px #fff,48px 12px #fff,60px 12px #fff,12px -12px #fff,24px -12px #fff,36px -12px #fff;
  opacity:.9;animation:drift 90s linear infinite}
.cloud.c1{top:16%;left:-120px}.cloud.c2{top:40%;left:-120px;animation-duration:140s;animation-delay:-60s;transform:scale(1.4)}.cloud.c3{top:62%;left:-120px;animation-duration:110s;animation-delay:-30s}
@keyframes drift{to{left:110vw}}
.floor{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:1;pointer-events:none;border-top:4px solid var(--ink);
  background:
   linear-gradient(var(--red2) 0 4px,transparent 4px) 0 0/100% 22px,
   linear-gradient(90deg,var(--red2) 0 4px,transparent 4px) 0 0/44px 22px,
   linear-gradient(90deg,var(--red2) 0 4px,transparent 4px) 22px 22px/44px 22px,
   var(--red)}

/* HUD */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:var(--cream);border-bottom:4px solid var(--red)}
.hud .brand{font-family:var(--px);font-size:11px;letter-spacing:.04em;color:var(--cream);cursor:pointer;display:flex;align-items:center;gap:8px;text-transform:uppercase;max-width:36vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hud .where{font-family:var(--px);font-size:9px;color:var(--sky2);text-transform:uppercase}
.hud .sp{flex:1}
.hud .stat{display:flex;align-items:center;gap:6px;font-family:var(--px);font-size:10px;white-space:nowrap}
.hud .stat b{background:none;color:var(--gold);font-weight:400}
.xpbar{display:flex;gap:2px;padding:3px;background:#0a1329;border:2px solid var(--sky2)}
.xpbar i{width:9px;height:12px;background:#22345f;display:block}
.xpbar i.on{background:var(--red)}
.hbtn{font-family:var(--px);font-size:9px;background:var(--sky3);color:var(--ink);border:3px solid var(--sky2);padding:7px 8px;cursor:pointer;text-transform:uppercase}
.hbtn:hover{background:#fff}.hbtn.on{background:var(--gold)}
.combo{font-family:var(--px);font-size:10px;color:var(--gold);min-width:84px;text-align:right}

/* layout */
#app{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:22px 16px 10px}
.panel{background:var(--paper);position:relative;padding:22px 26px;margin-bottom:22px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),10px 10px 0 0 rgba(18,33,63,.28)}
.panel.sky{background:var(--blue2)}
.panel.red{background:var(--red4)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:var(--px);font-size:9px;line-height:1;padding:7px 9px;background:var(--ink);color:var(--cream);text-transform:uppercase}
.chip.r{background:var(--red)}.chip.b{background:var(--blue)}.chip.g{background:var(--gold);color:var(--ink)}.chip.o{background:var(--ok)}
h1,h2,h3{font-family:var(--px);font-weight:400;line-height:1.5;text-transform:none}
h1{font-size:clamp(20px,3vw,34px);color:var(--ink)}
h2{font-size:clamp(14px,1.8vw,20px);color:var(--ink);margin-bottom:16px}
h3{font-size:12px;color:var(--red2);margin-bottom:8px}
p{margin:0 0 .6em}.mut{color:var(--mut)}.sm{font-size:.82em}
.lines{list-style:none;display:grid;gap:12px;margin:6px 0 16px}
.lines li{padding-left:34px;position:relative}

<script>window.__COURSE={"title": "Compound Interest", "slug": "compound-interest", "subtitle": "Why money grows like a snowball. Four short quests in one direction: see it, decode it, estimate it, solve it.", "about": "Demo course shipped with the gamify-learn skill. Original content that shows every feature: concept ledger, warm-ups, decoder, flow, compare, worked example, labs, solve steps, quizzes, flashcards.", "focus_minutes": 15, "glossary": [{"term": "Principal (P)", "meaning": "The money you start with: the first deposit. Everything else is built on top of it.", "where": "Quest 1"}, {"term": "Interest", "meaning": "A fee the bank pays you for keeping money with them, written as a percent of your balance per year.", "where": "Quest 1"}, {"term": "Simple interest", "meaning": "Interest paid only on the original principal. Same dollar amount every year, so growth is a straight line.", "where": "Quest 1"}, {"term": "Compound interest", "meaning": "Interest paid on the principal plus all interest already earned. Growth speeds up, so the graph is a curve.", "where": "Quest 1"}, {"term": "Rate (r)", "meaning": "The yearly interest rate written as a decimal: 10% is 0.10, 5% is 0.05.", "where": "Quest 1"}, {"term": "n", "meaning": "How many times per year the interest is added to the balance: 1 = yearly, 4 = quarterly, 12 = monthly, 365 = daily.", "where": "Quest 1"}, {"term": "Time (t)", "meaning": "How long the money stays invested, in years.", "where": "Quest 1"}, {"term": "Amount (A)", "meaning": "The balance at the end: principal plus all interest.", "where": "Quest 1"}, {"term": "Exponent", "meaning": "The small raised number in x^k. It says multiply x by itself k times. 1.1^3 = 1.1 x 1.1 x 1.1.", "where": "Quest 1"}, {"term": "Effective rate", "meaning": "The true yearly growth after compounding. 10% compounded daily is really about 10.52% a year.", "where": "Quest 1"}, {"term": "Doubling time", "meaning": "How many years until money doubles at a given rate.", "where": "Quest 2"}, {"term": "Rule of 72", "meaning": "Quick mental estimate: years to double is about 72 divided by the rate as a whole percent.", "where": "Quest 2"}, {"term": "Inflation", "meaning": "The rate at which prices rise, so the same money buys less each year.", "where": "Quest 2"}, {"term": "Real return", "meaning": "Your interest rate minus inflation: how fast your buying power actually grows.", "where": "Quest 2"}], "quests": [{"id": "q1", "title": "Money that makes money", "minutes": 10, "question": "How can $1,000 at 10% turn into about $17,400 when straight-line maths says $4,000?", "outcomes": ["Explain simple vs compound interest in one sentence", "Say what an exponent does", "Recognise the straight-line and the snowball curve"], "steps": [{"type": "predict", "prompt": "You put $1,000 in an account paying 10% a year and leave it for 30 years. Do you end up with about $4,000, $9,000 or $17,000?", "answer": "About **$17,400**. Most people guess $4,000 because they think in straight lines. Interest that earns interest is not a straight line, and that gap is this whole quest."}, {"type": "idea", "title": "Simple interest: the boring baseline", "lines": ["You deposit money. That first deposit is the **principal**.", "Every year the bank pays a percent of the **original** deposit only.", "10% of $1,000 is $100. Every year. Forever."], "analogy": "A tap dripping at a constant speed into a bucket. Twice as long, twice as much water.", "example": "$1,000 at 10% simple: year 1 = $1,100, year 2 = $1,200 ... year 30 = $4,000. A straight line.", "keep": "Simple interest = same dollars every year.", "teaches": ["principal", "simple"]}, {"type": "idea", "title": "Compound interest: interest earns interest", "lines": ["Each year's interest is **added to the balance**.", "Next year the percent is taken from the **bigger** balance.", "So the growth itself grows. The graph is a curve, not a line.", "Repeating the multiply has a short name: 1.10 x 1.10 x 1.10 = 1.10^3. The small raised 3 is the **exponent**: how many times you multiply."], "analogy": "A snowball rolling downhill. The bigger it gets, the more snow it picks up on every turn.", "example": "Year 1: $1,000 becomes $1,100. Year 2: $1,100 x 1.10 = $1,210. Year 3: $1,210 x 1.10 = $1,331.", "trap": "Compounding is not a higher rate. It is the **same rate** applied to a **growing balance**.", "teaches": ["compound", "exponent"]}, {"type": "quiz", "ids": ["q1"]}, {"type": "compare", "title": "Simple vs compound, side by side", "headers": ["Simple", "Compound"], "rows": [["Interest is paid on", "The original deposit only", "Deposit plus all interest earned so far"], ["Each year's interest", "The same dollars every year", "A bigger amount every year"], ["The graph is", "A straight line", "A curve that bends upward"], ["$1,000 at 10%, 30 years", "$4,000", "About $17,449"]], "keep": "Same rate, same deposit. The only difference is whether interest earns interest.", "needs": ["simple", "compound"]}, {"type": "flow", "title": "One year of compounding, as a loop", "intro": "Watch the balance go round the loop. The formula you decode next is this loop written in one line.", "nodes": [{"label": "START", "sub": "Balance B = $1,000"}, {"label": "SLICE", "sub": "Interest = B x r = $1,000 x 0.10 = $100"}, {"label": "ADD", "sub": "New B = $1,100"}, {"label": "REPEAT", "sub": "Next year starts from $1,100 and the loop runs again"}], "needs": ["compound", "exponent"]}, {"type": "dump", "prompt": "Without looking: explain simple vs compound interest and what an exponent is.", "points": ["Simple: interest on the original deposit only (straight line)", "Compound: interest on deposit plus earned interest (curve)", "Principal = the starting deposit", "Exponent = how many times you multiply a number by itself, e.g. 1.1^3 = 1.1 x 1.1 x 1.1"]}], "quiz": [{"q": "Which statement describes compound interest?", "answer": "Interest is calculated on the starting deposit plus all interest already earned", "wrong": ["Interest is calculated only on the starting deposit", "The bank raises the rate every year", "Interest is paid once, at the end"], "why": "Compound means the interest is added to the balance, so the next interest payment is bigger. Paying only on the starting deposit is simple interest.", "tag": "CONCEPT", "id": "q1", "concepts": ["simple", "compound"]}, {"q": "$1,000 at 10% simple interest for 3 years. What is the balance?", "answer": "$1,300", "wrong": ["$1,331", "$1,030", "$1,100"], "why": "Simple interest adds $100 per year for 3 years: $1,300. $1,331 is the compound answer (1,000 x 1.1^3).", "tag": "WORKED", "id": "q2", "concepts": ["simple", "principal"]}, {"id": "q3", "q": "What does 1.10^3 mean?", "answer": "1.10 x 1.10 x 1.10: multiply 1.10 by itself 3 times", "wrong": ["1.10 x 3", "1.10 + 3", "3 raised to the power 1.10"], "why": "The exponent counts repeated multiplication: 1.1 x 1.1 x 1.1 = 1.331. Multiplying by 3 would give 3.3, a straight line instead of a snowball.", "tag": "CONCEPT", "concepts": ["exponent"]}, {"id": "q4", "q": "Which graph shape does compound interest make?", "answer": "A curve that bends upward", "wrong": ["A straight line", "A flat line", "A zigzag"], "why": "Interest earns interest, so growth speeds up. A straight line is simple interest.", "tag": "CONCEPT", "concepts": ["compound", "simple"]}], "cards": [{"front": "Simple vs compound interest?", "back": "Simple: % of the original deposit only (line). Compound: % of deposit + earned interest (curve).", "concepts": ["simple", "compound"]}, {"front": "What is P?", "back": "Principal: the starting deposit. It only scales the answer.", "concepts": ["principal"]}, {"front": "What does an exponent do?", "back": "It says how many times to multiply a number by itself: 1.1^3 = 1.1 x 1.1 x 1.1.", "concepts": ["exponent"]}, {"front": "Why is compound interest a curve?", "back": "Each year's interest is added to the balance, so the next year's interest is bigger.", "concepts": ["compound"]}], "recap": {"lines": ["Simple interest = same dollars every year: a straight line.", "Compound interest = interest on interest: a curve.", "An exponent is repeated multiplication."], "teach": "Explain to a friend why $1,000 at 10% becomes about $17,400 in 30 years and not $4,000."}, "next_hook": "You can see the snowball. But what do the symbols in its formula actually mean? That is next."}, {"id": "q2", "title": "Decode the formula", "minutes": 12, "question": "What does every symbol in A = P(1 + r/n)^(nt) actually do?", "previously": "Quest 1 showed compound interest as a loop: slice, add, repeat. Now the whole loop becomes one line of symbols, and you will know what each one does.", "needs": ["principal", "compound", "exponent"], "outcomes": ["Say what A, P, r, n and t mean and what each does to the answer", "Compute a balance by hand", "Use the sliders to see which symbols matter most"], "steps": [{"type": "predict", "prompt": "In A = P(1 + r/n)^(nt), which symbol do you think has the biggest effect over 30 years: P, r, n or t? Guess now. The lab at the end settles it.", "answer": "**t and r** bend the curve. **P** only scales it, and **n** barely matters. You will see it with your own hands in the lab."}, {"type": "decode", "title": "Decode the compound interest formula", "intro": "One line of symbols. Here is what each piece IS, in plain words, and what it does to the answer.", "formula": "[[0|A]] = [[1|P]] (1 + [[2|r]] / [[3|n]])<sup>[[3|n]][[4|t]]<\/sup>", "read": "A equals P times one-plus-r-over-n, raised to the power n times t.", "parts": [{"sym": "[[0|A]]", "name": "AMOUNT (the answer)", "plain": "How much money you have at the end: your starting money plus all the interest.", "effect": "It is what you solve for. Bigger P, r, n or t all push A up."}, {"sym": "[[1|P]]", "name": "PRINCIPAL (what you start with)", "plain": "The first deposit, in dollars.", "effect": "Double P and A exactly doubles. P scales everything but never changes how fast it grows."}, {"sym": "[[2|r]]", "name": "RATE (yearly interest)", "plain": "The yearly interest rate as a decimal. 10% is 0.10.", "effect": "Higher r bends the curve upward. 6% vs 8% looks tiny but explodes over decades."}, {"sym": "[[3|n]]", "name": "COMPOUNDS PER YEAR", "plain": "How many times a year interest is added: 1 = yearly, 12 = monthly, 365 = daily.", "effect": "More often helps, but only a little: 10% compounded daily is about 10.52% a year, not 20%."}, {"sym": "[[4|t]]", "name": "TIME (in years)", "plain": "How long the money stays invested.", "effect": "t sits in the exponent, so every extra year multiplies the balance again. Time is the strongest lever."}], "note": "**r/n** cuts the yearly rate into n smaller slices. **n x t** counts how many slices happen in total. Each slice multiplies your balance by (1 + r/n).", "trap": "Type r as **0.10**, not 10. If you use 10 you are claiming 1000% interest.", "teaches": ["amount", "rate", "comp_n", "time"], "needs": ["principal", "compound", "exponent"]}, {"type": "quiz", "ids": ["q1"]}, {"type": "worked", "title": "Worked example: compute it by hand", "problem": "You deposit **$2,000** at **6%** a year, compounded **monthly**, for **5 years**. What is A?", "steps": [{"label": "List the symbols", "work": "P = 2000,  r = 0.06,  n = 12,  t = 5"}, {"label": "Slice the rate", "work": "r / n = 0.06 / 12 = 0.005"}, {"label": "Count the slices", "work": "n x t = 12 x 5 = 60"}, {"label": "Growth per slice", "work": "1 + 0.005 = 1.005"}, {"label": "Repeat 60 times", "work": "1.005^60 = 1.34885"}, {"label": "Scale by P", "work": "2000 x 1.34885 = 2697.70"}], "answer": "A is about **$2,697.70**. Interest earned: about $697.70.", "needs": ["principal", "amount", "rate", "comp_n", "time"]}, {"type": "quiz", "ids": ["q2"]}, {"type": "lab", "title": "Lab: pull every lever yourself", "intro": "Red = compound, blue = simple. Move one slider at a time and watch which output changes.", "controls": [{"id": "P", "label": "P: principal", "min": 100, "max": 10000, "step": 100, "value": 1000, "fmt": "$0"}, {"id": "r", "label": "r: yearly rate", "min": 0.01, "max": 0.15, "step": 0.005, "value": 0.1, "fmt": "%"}, {"id": "n", "label": "n: compounds per year", "min": 1, "max": 12, "step": 1, "value": 1, "fmt": "0"}, {"id": "t", "label": "t: years", "min": 1, "max": 40, "step": 1, "value": 30, "fmt": "0"}], "outputs": [{"label": "A: compound balance", "expr": "P*pow(1+r/n,n*t)", "fmt": "$0"}, {"label": "Simple-interest balance", "expr": "P*(1+r*t)", "fmt": "$0"}, {"label": "Extra from compounding", "expr": "P*pow(1+r/n,n*t)-P*(1+r*t)", "fmt": "$0"}], "plot": {"x": [0, 40], "at": "t", "xlabel": "years", "ylabel": "balance ($)", "series": [{"expr": "P*pow(1+r/n,n*x)", "label": "compound"}, {"expr": "P*(1+r*x)", "label": "simple", "color": "#1f7fd1"}]}, "tries": ["Set t = 5, then 20, then 40. Where does the red curve pull away from the blue line?", "Drop r to 3%, then raise it to 12%. Which slider bends the curve most?", "Move n from 1 to 12. How big is the change in A, really?", "Double P. Does A exactly double?"], "keep": "Time and rate bend the curve. Principal only scales it. n barely matters.", "needs": ["principal", "amount", "rate", "comp_n", "time", "compound", "simple"]}, {"type": "dump", "prompt": "Without looking: explain compound interest and what A, P, r, n and t mean.", "points": ["Interest is paid on principal + earlier interest (snowball)", "A = final amount, P = starting deposit", "r = yearly rate as a decimal (0.10 for 10%)", "n = compounds per year, t = years", "t is in the exponent, so time is the strongest lever", "More frequent compounding (n) helps only slightly"]}], "quiz": [{"q": "In A = P(1 + r/n)^(nt), what does n stand for?", "answer": "How many times per year interest is added to the balance", "wrong": ["The number of years", "The number of deposits you make", "The interest rate as a percent"], "why": "n counts compounding periods per year (12 = monthly). The number of years is t, and the rate is r.", "tag": "DECODER", "id": "q1", "concepts": ["comp_n"]}, {"q": "You write r = 5 for a 5% rate in the formula. What goes wrong?", "answer": "You are using 500% interest; it must be r = 0.05", "wrong": ["Nothing, the formula accepts whole percents", "You are using 0.5% interest", "You get the simple-interest answer"], "why": "The formula wants a decimal. 5% = 5/100 = 0.05. Plugging in 5 means 500%.", "tag": "TRAP", "id": "q2", "concepts": ["rate"]}, {"q": "You double P and change nothing else. What happens to A?", "answer": "A exactly doubles", "wrong": ["A more than doubles because of compounding", "A stays the same", "A grows by the interest rate"], "why": "P is a plain multiplier in front of the formula, so doubling P doubles A. Compounding changes the growth rate, not the scaling.", "tag": "DECODER", "id": "q3", "concepts": ["principal", "amount"]}, {"q": "10% compounded daily instead of yearly changes the yearly growth to about:", "answer": "10.5%", "wrong": ["20%", "15%", "10% (no change at all)"], "why": "(1 + 0.10/365)^365 is about 1.1052, so about 10.52%. It helps a little. It does not double the rate.", "tag": "LAB", "id": "q4", "concepts": ["comp_n", "rate"]}, {"q": "Why is time (t) the strongest lever in the formula?", "answer": "t is in the exponent, so every extra year multiplies the balance again", "wrong": ["t is multiplied by P", "t is the largest number in the formula", "Longer time raises the interest rate"], "why": "Exponents repeat multiplication. Each extra year multiplies the whole balance by the same growth factor, so the effect stacks.", "tag": "CONCEPT", "id": "q5", "concepts": ["time", "exponent"]}], "cards": [{"front": "A = P(1 + r/n)^(nt): what is A?", "back": "Amount: the final balance.", "concepts": ["amount"]}, {"front": "How do you type r for 7%?", "back": "As a decimal: r = 0.07.", "concepts": ["rate"]}, {"front": "What are n and t?", "back": "n = compounds per year (12 = monthly). t = years.", "concepts": ["comp_n", "time"]}, {"front": "Which symbol is the strongest lever and why?", "back": "t: it is in the exponent, so every extra year multiplies the balance again.", "concepts": ["time", "exponent"]}, {"front": "What is P?", "back": "Principal: the starting deposit. It only scales the answer.", "concepts": ["principal"]}], "recap": {"lines": ["A = P(1 + r/n)^(nt): P scales, r and t bend, n helps a little.", "r goes in as a decimal (0.10 for 10%).", "t is in the exponent, so time is the strongest lever."], "teach": "Point at each symbol of the formula and say what it is and what it does, without looking."}, "next_hook": "You can compute a balance. But how long until your money doubles? There is a trick you can do in your head."}, {"id": "q3", "title": "Rule of 72, inflation and starting early", "minutes": 10, "outcomes": ["Estimate doubling time in your head with the Rule of 72", "Explain why inflation is compounding working against you", "Show with numbers why starting early beats starting big"], "steps": [{"type": "predict", "prompt": "Roughly how many years does it take money to double at 8% a year? 5, 9 or 15?", "answer": "About **9 years**. There is a shortcut that gets you there in your head. That is the next screen."}, {"type": "decode", "title": "Decode the Rule of 72", "formula": "[[0|years]] &asymp; [[1|72]] / [[2|r]]", "read": "Years to double is about 72 divided by the rate.", "parts": [{"sym": "[[0|years]]", "name": "DOUBLING TIME", "plain": "How many years until your money is twice what it was.", "effect": "Higher rate means fewer years to double."}, {"sym": "[[1|72]]", "name": "THE MAGIC NUMBER", "plain": "About 69.3 (that is 100 x ln 2) rounded up to 72 because 72 divides evenly by 2, 3, 4, 6, 8, 9 and 12.", "effect": "It is fixed. It never changes."}, {"sym": "[[2|r]]", "name": "RATE AS A WHOLE PERCENT", "plain": "Use 8 for 8%, not 0.08.", "effect": "Double the rate and you halve the years."}], "trap": "Here r is a **whole number** (8). In the compound formula r was a **decimal** (0.08). Different tools, different units.", "teaches": ["rule72", "doubling"], "needs": ["rate"]}, {"type": "quiz", "ids": ["q1"]}, {"type": "worked", "title": "Worked example: double and quadruple", "problem": "Money grows at **6%** a year. How long to double? How long to become 4 times as big?", "steps": [{"label": "Rule of 72", "work": "72 / 6 = 12 years to double"}, {"label": "4x = two doublings", "work": "double once, then double again: 12 + 12 = 24 years"}, {"label": "Sanity check", "work": "1.06^12 = 2.01 (about double). 1.06^24 = 4.05 (about 4x)"}], "answer": "Doubles in about **12 years**, quadruples in about **24 years**.", "needs": ["rule72", "doubling", "exponent"]}, {"type": "lab", "title": "Lab: how good is the Rule of 72?", "controls": [{"id": "r", "label": "rate (whole percent)", "min": 1, "max": 20, "step": 1, "value": 8, "fmt": "0", "unit": "%"}], "outputs": [{"label": "Rule of 72 says", "expr": "72/r", "fmt": "1", "unit": "years"}, {"label": "Exact answer", "expr": "log(2)/log(1+r/100)", "fmt": "1", "unit": "years"}], "svg": "<svg viewBox='0 0 640 110' width='100%'><text x='6' y='24' font-size='17' font-family='monospace' fill='#12213f'>Rule of 72<\/text><rect x='130' y='6' width='{{min(72/r*20,500)}}' height='24' fill='#e63946' stroke='#12213f' stroke-width='3'/><text x='6' y='64' font-size='17' font-family='monospace' fill='#12213f'>Exact<\/text><rect x='130' y='46' width='{{min(log(2)/log(1+r/100)*20,500)}}' height='24' fill='#1f7fd1' stroke='#12213f' stroke-width='3'/><text x='130' y='98' font-size='14' font-family='monospace' fill='#40527a'>bar length = years to double (20 px per year, capped)<\/text><\/svg>", "plot": {"x": [0, 40], "xlabel": "years", "ylabel": "money (x starting amount)", "series": [{"expr": "pow(1+r/100,x)", "label": "growth"}]}, "tries": ["Try 2%, 8% and 18%. Where are the estimate and the exact answer closest?", "Find the year where the curve crosses 2. Does it match the number above?"], "keep": "Rule of 72 is a quick estimate. It is closest at middling rates.", "needs": ["rule72", "doubling", "rate", "exponent"]}, {"type": "quiz", "ids": ["q2", "q3"]}, {"type": "idea", "title": "Inflation: the same math, working against you", "lines": ["Prices compound too. At 3% inflation prices double in about **24 years** (72 / 3).", "Money sitting in a drawer buys less every year.", "What counts is your **real return**: your interest rate minus inflation."], "analogy": "A leaking bucket. Each day's leak looks tiny, but the level keeps dropping.", "keep": "Real return is about interest rate minus inflation rate.", "trap": "Savings paying 3% when inflation is 4% means your buying power is **shrinking** by about 1% a year.", "teaches": ["inflation", "real_return"], "needs": ["compound", "exponent"]}, {"type": "quiz", "ids": ["q4"]}, {"type": "idea", "title": "Start early beats start big", "lines": ["Ana puts **$5,000** in at age 25. Ben puts **$5,000** in at age 35.", "Both earn 7% a year until age 65 and add nothing else.", "Ana's money compounds for 40 years, Ben's for 30."], "example": "Ana: 5,000 x 1.07^40 = **about $74,900**. Ben: 5,000 x 1.07^30 = **about $38,100**. Same deposit, almost double the result, because of 10 extra years.", "keep": "Time is in the exponent. Money is only the multiplier.", "teaches": ["start_early"], "needs": ["time", "exponent", "compound"]}, {"type": "dump", "prompt": "Without looking: Rule of 72, inflation, and why starting early wins.", "points": ["Years to double is about 72 / rate (whole percent)", "Double the rate halves the doubling time", "Inflation is compounding against you; real return is rate minus inflation", "Starting early wins because t is in the exponent"]}], "quiz": [{"q": "Rule of 72: about how many years to double money at 9%?", "answer": "8 years", "wrong": ["6 years", "12 years", "9 years"], "why": "72 / 9 = 8. The most common slip is to answer 9 because the rate is 9.", "tag": "WORKED", "id": "q1", "concepts": ["rule72", "doubling"]}, {"q": "In years = 72 / r, how do you enter an 8% rate?", "answer": "r = 8 (whole percent)", "wrong": ["r = 0.08", "r = 80", "r = 1.08"], "why": "The Rule of 72 uses whole percents. The compound-interest formula uses decimals. Mixing them up is the classic mistake.", "tag": "TRAP", "id": "q2", "concepts": ["rule72", "rate"]}, {"q": "Money doubles in 12 years. How long until it is 4 times the original?", "answer": "24 years (two doublings)", "wrong": ["48 years", "36 years", "16 years"], "why": "4x is two doublings: 2 x 2. Two doublings take 12 + 12 = 24 years.", "tag": "WORKED", "id": "q3", "concepts": ["doubling"]}, {"q": "Inflation is 4% and your savings pay 3%. Your buying power:", "answer": "Slowly shrinks (real return about -1%)", "wrong": ["Grows by about 3%", "Stays flat", "Grows by about 7%"], "why": "Real return is roughly rate minus inflation: 3% - 4% = -1%. You have more dollars but they buy less.", "tag": "CONCEPT", "id": "q4", "concepts": ["inflation", "real_return"]}, {"q": "Ana invests $5,000 at 25 and Ben $5,000 at 35, both at 7% to age 65. Ana ends with about:", "answer": "Twice Ben's amount", "wrong": ["The same as Ben", "10% more than Ben", "Four times Ben's amount"], "why": "1.07^40 = 14.97 and 1.07^30 = 7.61, a ratio of about 1.97. Ten extra years in the exponent nearly doubles the result.", "tag": "LAB", "id": "q5", "concepts": ["start_early", "time", "exponent"]}, {"q": "Why is the Rule of 72 using 72 and not 69?", "answer": "72 is close to 69.3 and divides evenly by many common rates", "wrong": ["72 is the number of months in 6 years", "72 is the legal compounding limit", "72 is the average stock market return"], "why": "The exact number is about 69.3 (100 x ln 2). 72 is easier because it divides by 2, 3, 4, 6, 8, 9 and 12, and it is more accurate near 8%.", "tag": "CONCEPT", "id": "q6", "concepts": ["rule72"]}], "cards": [{"front": "Rule of 72?", "back": "Years to double is about 72 / rate (as a whole percent).", "concepts": ["rule72"]}, {"front": "Double the rate: what happens to doubling time?", "back": "It halves.", "concepts": ["rule72", "doubling"]}, {"front": "How do you enter 8% in the Rule of 72 vs in the compound formula?", "back": "Rule of 72: 8. Compound formula: 0.08.", "concepts": ["rule72", "rate"]}, {"front": "What is real return?", "back": "Interest rate minus inflation rate: how fast buying power grows.", "concepts": ["real_return", "inflation"]}, {"front": "Why does starting early beat starting big?", "back": "Time is in the exponent, so each extra year multiplies the balance again.", "concepts": ["start_early", "time"]}], "recap": {"lines": ["72 / rate (whole percent) is about the years to double.", "Inflation is compounding against you; look at real return.", "Time in the exponent beats extra dollars."], "teach": "Tell a friend how long their money takes to double at 6% and why waiting 10 years to start costs so much."}, "question": "Can you estimate how long money takes to double without a calculator?", "previously": "In Quest 2 you decoded A = P(1 + r/n)^(nt). Now we turn the question around: not 'how much?' but 'how long?'", "needs": ["rate", "time", "exponent"], "next_hook": "You have all the tools. Next quest is pure practice: problems with the steps hidden until you try."}, {"id": "q4", "title": "Your turn: solve it yourself", "minutes": 15, "question": "Can you solve a whole problem from scratch, start to finish, with the steps hidden until you have tried?", "previously": "Quests 1 to 3 gave you the tools: the decoded formula, the Rule of 72 and the inflation idea. This quest is all practice, and every problem reuses something you already learned.", "needs": ["principal", "rate", "comp_n", "time", "amount", "compound", "simple", "doubling", "rule72", "inflation", "real_return", "exponent"], "outcomes": ["Compute a compound balance from scratch with any compounding frequency", "Estimate and check doubling time", "Convert a future amount into today' <script>
/* gamify-learn engine. Reads window.__COURSE (see references/schema.md). No dependencies, works offline. */
(function(){
'use strict';
const D=window.__COURSE;
const SLUG=(D.slug||D.title||'course').toString().toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);
const KEY='gamify_learn_'+SLUG+'_v1';
let S={xp:0,streak:0,last:'',ans:{},cards:{},done:{},dumps:{},hooks:{},badges:{},calm:false,sfx:false,tmin:D.focus_minutes||15,combo:0,best:0,raids:0,seen:false,solves:{},unlockAll:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(el,q)=>el.querySelector(q), $$=(el,q)=>[...el.querySelectorAll(q)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const dnum=s=>Math.floor(new Date(s+'T00:00:00').getTime()/864e5);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fmt(s){
  if(s==null)return '';
  return String(s)
   .replace(/\[\[(\d)\|([^\]]+)\]\]/g,'<b class="k$1">$2</b>')
   .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
   .replace(/`([^`]+)`/g,'<code>$1</code>')
   .replace(/==([^=]+)==/g,'<mark>$1</mark>');
}
const fmtF=s=>String(s==null?'':s).replace(/\[\[(\d)\|([^\]]+)\]\]/g,'<b class="k$1">$2</b>');

/* ---------- pixel icons ---------- */
const PAL={r:'#e63946',R:'#a4161a',w:'#ffffff',y:'#ffd23f',o:'#ff8a3d',b:'#2a9df4',B:'#1769ab',n:'#12213f',c:'#8fe3ff',g:'#1a9a5f'};
const BM={
 heart:['.rr..rr.','rwrrrrrr','rrrrrrrr','rrrrrrrr','.rrrrrr.','..rrrr..','...rr...'],

 trophy:['yyyyyyyyy','y.yyyyy.y','y.yyyyy.y','.yyyyyyy.','..yyyyy..','...yyy...','....y....','...ooo...','..ooooo..'],

 skull:['.wwwww.','wwwwwww','wnwwwnw','wnwwwnw','wwwnwww','.wwwww.','.w.w.w.'],

};
function icon(name,px){
  const rows=BM[name];if(!rows)return '';px=px||3;
  const w=Math.max(...rows.map(r=>r.length));let rects='';
  rows.forEach((r,y)=>{[...r].forEach((ch,x)=>{if(ch!=='.')rects+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+PAL[ch]+'"/>'})});
  return '<svg class="ic" width="'+w*px+'" height="'+rows.length*px+'" viewBox="0 0 '+w+' '+rows.length+'" shape-rendering="crispEdges" aria-hidden="true">'+rects+'</svg>';
}

/* ---------- normalise course ---------- */
const QUESTS=D.quests||[];const BANK={},CARDS={};
QUESTS.forEach((q,i)=>{
  q.n=i+1;q.id=q.id||('q'+q.n);q.world=q.world||('1-'+q.n);q.minutes=q.minutes||12;
  q.quiz=(q.quiz||[]).map((x,j)=>{const id=q.id+'-'+(x.id||('q'+(j+1)));const o=Object.assign({},x,{id,quest:q.id});BANK[id]=o;return o});
  q.cardsList=(q.cards||[]).map((c,j)=>{const id=q.id+'-c'+(j+1);CARDS[id]={f:c.front||c.f,b:c.back||c.b,quest:q.id,concepts:c.concepts||[]};return id});
  q.steps=buildSteps(q);
});
function buildSteps(q){
  const out=[{t:'mission'}];const placed=new Set();let cardsPlaced=false;
  if(q.n>1&&q.warmup!==false&&QUESTS.slice(0,q.n-1).some(p=>p.quiz.length))out.push({t:'warmup'});
  (q.steps||[]).forEach(s=>{
    if(s.type==='quiz'){const ids=(s.ids||q.quiz.map(x=>x.id.split('-').slice(1).join('-'))).map(x=>q.id+'-'+x);ids.forEach(id=>{if(BANK[id]&&!placed.has(id)){placed.add(id);out.push({t:'question',id})}})}
    else if(s.type==='cards'){out.push({t:'cards'});cardsPlaced=true}
    else out.push(Object.assign({t:s.type},s));
  });
  q.quiz.forEach(x=>{if(!placed.has(x.id))out.push({t:'question',id:x.id})});
  if(!cardsPlaced&&q.cardsList.length)out.push({t:'cards'});
  out.push({t:'recap'});
  return out;
}
/* concept ledger: what is taught where, so the story stays in one direction and ideas can be relearned */
const CON={};(D.concepts||[]).forEach(c=>{CON[c.id]=Object.assign({},c)});
QUESTS.forEach((q,qi)=>q.steps.forEach((st,i)=>{(st.teaches||[]).forEach(id=>{CON[id]=CON[id]||{id,name:id.replace(/_/g,' ')};if(CON[id].quest==null){CON[id].quest=qi;CON[id].step=i}})}));
const CONLIST=Object.values(CON).filter(c=>c.quest!=null).sort((a,b)=>a.quest-b.quest||a.step-b.step);
const SOLVE={};QUESTS.forEach(q=>q.steps.forEach((st,i)=>{if(st.t==='solve')SOLVE[q.id+'-s'+i]={concepts:st.needs||[],quest:q.id,step:i,title:st.title}}));
const cname=id=>(CON[id]&&CON[id].name)||id;
const chips=ids=>ids.map(id=>'<span class="cchip">'+esc(cname(id))+'</span>').join(' ');
function conceptNeeds(q){const qi=q.n-1,set=new Set(q.needs||[]);q.steps.forEach(st=>(st.needs||[]).forEach(c=>set.add(c)));return [...set].filter(c=>CON[c]&&CON[c].quest!=null&&CON[c].quest<qi)}
function mastery(cid){let n=0;
  Object.keys(BANK).forEach(id=>{if((BANK[id].concepts||[]).includes(cid)&&S.ans[id]&&S.ans[id].last)n++});
  Object.keys(CARDS).forEach(id=>{if((CARDS[id].concepts||[]).includes(cid)&&S.cards[id]&&S.cards[id].box>=2)n++});
  Object.keys(SOLVE).forEach(id=>{const r=S.solves[id];if(r&&r.r!=='no'&&SOLVE[id].concepts.includes(cid))n++});
  return Math.min(3,n)}
const FORCE=/[?&](reveal|selftest)/.test(location.search);
const isLocked=i=>D.linear!==false&&!S.unlockAll&&!FORCE&&i>0&&!S.done[QUESTS[i-1].id];
function track(cur){return '<div class="track">'+QUESTS.map((q,i)=>'<div class="tn '+(S.done[q.id]?'done':i===cur?'cur':'')+'" title="'+esc(q.title)+'"><span>'+(i+1)+'</span>'+(i===cur?'<em>YOU ARE HERE</em>':'')+'</div>').join('<s></s>')+'</div>'}

/* ---------- audio (off by default) ---------- */
let AC=null;
function beep(seq){
  if(!S.sfx||S.calm)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
    seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9})}catch(e){}
}
const SND={ok:()=>beep([[660,.09],[990,.14]]),bad:()=>beep([[180,.18,'sawtooth'],[130,.22,'sawtooth']]),lvl:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.25]]),click:()=>beep([[440,.04]]),badge:()=>beep([[784,.1],[988,.1],[1319,.2]])};

/* ---------- chrome ---------- */
const root=document.getElementById('app');
const hud=document.getElementById('hud');
const navEl=document.getElementById('nav');
const toasts=document.getElementById('toasts');
if(S.calm)document.body.classList.add('calm');
const lvl=()=>Math.floor(S.xp/100)+1;
let where='MAP';

  const seg=Math.floor((S.xp%100)/10);
  hud.innerHTML='<span class="brand" data-a="map">'+icon('hero',2)+'<span>'+esc(D.title)+'</span></span><span class="where">'+esc(where)+'</span><span class="sp"></span>'+
   '<span class="combo">'+(S.combo>=2?'COMBO x'+S.combo:'')+'</span>'+
   '<span class="stat">'+icon('bolt',2)+'LV <b>'+lvl()+'</b></span><span class="xpbar" title="'+(S.xp%100)+' / 100 XP to next level">'+Array.from({length:10},(_,i)=>'<i class="'+(i<seg?'on':'')+'"></i>').join('')+'</span>'+
   '<span class="stat">'+icon('coin',2)+'<b>'+S.xp+'</b></span><span class="stat">'+icon('flame',2)+'<b>'+S.streak+'</b></span>'+
   '<button class="hbtn'+(timerRun?' on':'')+'" data-a="timer" title="Focus timer (T)">'+(timerRun?'FOCUS ':'TIMER ')+tFmt()+'</button>'+
   '<button class="hbtn" data-a="gloss" title="Glossary (G)">GLOSS</button><button class="hbtn" data-a="menu" title="Settings">MENU</button>';
}
hud.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
  if(k==='map')go({v:'map'});else if(k==='timer')tToggle();else if(k==='gloss')glToggle(true);else if(k==='menu')menu();});
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;toasts.appendChild(t);setTimeout(()=>t.remove(),2600)}
function confetti(n){if(S.calm)return;const cols=['#e63946','#2a9df4','#ffd23f','#fff','#12213f'];for(let i=0;i<(n||40);i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2200)}}
function touch(){const t=today();if(S.last!==t){S.streak=(S.last&&dnum(t)-dnum(S.last)===1)?S.streak+1:1;S.last=t;if(S.streak>=3)award('streak3');if(S.streak>=7)award('streak7')}}

  if(!n)return;touch();const before=lvl();S.xp+=n;save();renderHud();toast('+'+n+' XP  '+why);

/* ---------- overlay helpers ---------- */
function overlay(html,opts){
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(o);

let V={v:'title'};
function go(v){if(v.v==='quest'&&isLocked(v.q)){toast('Locked: finish the previous quest first. One direction keeps the story clear.');v={v:'map'}}V=v;if(v.v==='quest'){S.seen=true}render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+(v.v==='quest'?'q'+(v.q+1)+'/'+(v.i+1):v.v))}catch(e){}}
const qIdx=id=>QUESTS.findIndex(q=>q.id===id);
function questDone(q){return !!S.done[q.id]}
function qStats(q){const ids=q.quiz.map(x=>x.id);const tried=ids.filter(i=>S.ans[i]).length;const first=ids.filter(i=>S.ans[i]&&S.ans[i].first).length;return{tried,first,n:ids.length,pc:ids.length?Math.round(100*tried/ids.length):0,acc:tried?first/ids.length:0}}
const dueIds=()=>Object.keys(S.cards).filter(id=>CARDS[id]&&S.cards[id].due<=today());
const missIds=()=>Object.keys(S.ans).filter(id=>S.ans[id].last===false&&BANK[id]);

function render(){
  navEl.innerHTML='';document.title=D.title;
  const fn={title:rTitle,map:rMap,quest:rQuest,review:rReview,raid:rRaid,retry:rRetry}[V.v];
  if(V.v!=='quest')where=V.v==='map'?'MAP':V.v==='title'?'TITLE':V.v.toUpperCase();

}

/* ---------- map ---------- */
function nextBest(){
  const due=dueIds().length;
  if(due)return{t:'REVIEW '+due+' CARD'+(due>1?'S':'')+' (3 MIN)',go:{v:'review'}};
  const nq=QUESTS.find(q=>!questDone(q));
  if(nq){const started=nq.steps.some(()=>false)||qStats(nq).tried>0;return{t:(started?'CONTINUE: ':'START: ')+nq.title,go:{v:'quest',q:qIdx(nq.id),i:0},q:nq}}
  return{t:'BOSS RAID: TEST EVERYTHING',go:{v:'raid'}};
}
function solveLoc(id){const x=SOLVE[id];return x?{v:'quest',q:qIdx(x.quest),i:x.step}:{v:'map'}}

   '<div class="stats"><span class="stat2">'+icon('bolt',2)+'LV <b>'+lvl()+'</b></span><span class="stat2">'+icon('coin',2)+'<b>'+S.xp+'</b> XP</span><span class="stat2">'+icon('flame',2)+'STREAK <b>'+S.streak+'</b></span><span class="stat2">ANSWERED <b>'+tot+'</b>  RIGHT LAST TIME <b>'+right+'</b></span>'+(sids.length?'<span class="stat2">SOLVED <b>'+sdone+'/'+sids.length+'</b></span>':'')+'</div>'+

   '<div class="qgrid">'+cards+'</div>'+tree+

  root.onclick=e=>{const q=e.target.closest('.qc');if(q){go({v:'quest',q:+q.dataset.q,i:0});return}

/* ---------- quest runner ---------- */
let gated=false,reveals=[],shown=0;
function rQuest(){
  const q=QUESTS[V.q],s=q.steps[V.i];where='Q'+q.n+'  '+(V.i+1)+'/'+q.steps.length;
  gated=false;
  const chip=({mission:'MISSION',predict:'PREDICT',idea:'LEARN',decode:'DECODER',worked:'WORKED EXAMPLE',lab:'LAB',figure:'FIGURE',dump:'RECALL',question:'QUIZ',cards:'FLASHCARDS',recap:'RECAP',html:'LEARN',warmup:'WARM-UP',flow:'FLOW',compare:'COMPARE',solve:'YOUR TURN'})[s.t]||'STEP';
  const head='<div class="chips"><span class="chip r">'+chip+'</span><span class="chip">WORLD '+esc(q.world)+'  '+esc(q.title)+'</span></div>';
  const R={mission:sMission,predict:sPredict,idea:sIdea,decode:sDecode,worked:sWorked,lab:sLab,figure:sFigure,dump:sDump,question:sQuestion,cards:sCards,recap:sRecap,html:sHtml,warmup:sWarmup,flow:sFlow,compare:sCompare,solve:sSolve}[s.t];
  if(!R){root.innerHTML='<div class="panel">Unknown step type: '+esc(s.t)+'</div>';return}
  root.innerHTML='<div class="panel">'+head+'<div id="body"></div></div>';
  const body=$(root,'#body');R(body,q,s);
  reveals=$$(body,'.rv');shown=0;navDraw(q);
  if(/[?&]reveal/.test(location.search)){revealAll();navDraw(q);if(s.t==='question'&&body._pick)body._pick(body._correct)}  /* ?reveal: show everything (screenshots, printing) */
}
function navDraw(q){
  const q2=QUESTS[V.q],last=V.i===q2.steps.length-1;
  const rem=reveals.length-shown;
  const label=gated?'ANSWER FIRST':(rem>0?'REVEAL':(last?'MAP':'NEXT'));
  navEl.innerHTML='<button class="btn ghost sm2" data-n="back"'+(V.i===0?' disabled':'')+'>BACK</button>'+
   '<div class="dots">'+q2.steps.map((_,i)=>'<i class="'+(i<V.i?'done':i===V.i?'cur':'')+'"></i>').join('')+'</div><span class="pos">'+(V.i+1)+'/'+q2.steps.length+'</span>'+
   '<button class="btn" data-n="next"'+(gated?' disabled':'')+'>'+label+' &#9654;</button><span class="hint">SPACE = '+(rem>0?'reveal':'next')+'</span>';
}
navEl.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;b.dataset.n==='next'?next():prev()});
function next(){
  if(V.v!=='quest'||gated)return;
  if(shown<reveals.length){reveals[shown++].classList.add('on');navDraw();SND.click();const r=reveals[shown-1];r.scrollIntoView({block:'nearest',behavior:S.calm?'auto':'smooth'});return}
  const q=QUESTS[V.q];if(V.i<q.steps.length-1)go({v:'quest',q:V.q,i:V.i+1});else go({v:'map'});
}
function prev(){if(V.v!=='quest')return;const q=QUESTS[V.q];if(V.i>0)go({v:'quest',q:V.q,i:V.i-1})}
function gate(on){gated=on;if(V.v==='quest')navDraw()}
function revealAll(){reveals.forEach(r=>r.classList.add('on'));shown=reveals.length}

const li=(arr,cls)=>'<ul class="lines">'+(arr||[]).map(l=>'<li class="rv">'+fmt(l)+'</li>').join('')+'</ul>';
const co=(cls,label,txt)=>txt?'<div class="co '+cls+' rv"><small>'+label+'</small>'+fmt(txt)+'</div>':'';
function vizHtml(v){
  if(!v)return '';
  if(typeof v==='string')return '<div class="vizbox rv">'+v+'</div>';
  return '';
}
function figHtml(s){
  if(!s.src)return '';
  return '<figure class="rv"><img src="'+s.src+'" alt="'+esc(s.caption||s.title||'figure')+'">'+(s.caption?'<figcaption>'+fmt(s.caption)+(s.credit?' <span class="mut">('+esc(s.credit)+')</span>':'')+'</figcaption>':'')+'</figure>';
}
function sMission(b,q){
  const i=q.n-1,prev=QUESTS[i-1];
  const taught=[];q.steps.forEach(st=>(st.teaches||[]).forEach(id=>taught.push(id)));
  const needed=conceptNeeds(q);
  b.innerHTML=track(i)+'<h1>'+esc(q.title)+'</h1><p class="mut" style="margin:8px 0 14px">'+q.minutes+' min  |  '+q.steps.length+' steps  |  '+q.quiz.length+' quiz questions  |  go at your own pace</p>'+
   (q.question?'<div class="co ana"><small>THE QUESTION THIS QUEST ANSWERS</small>'+fmt(q.question)+'</div>':'')+
   (prev?'<div class="co say"><small>LAST TIME</small>'+fmt(q.previously||('You finished <b>'+esc(prev.title)+'</b>. This quest builds directly on it.'))+'</div>':'')+
   (needed.length?'<div class="co eg"><small>YOU WILL USE (FROM EARLIER)</small>'+chips(needed)+'</div>':'')+
   (taught.length?'<div class="co keep"><small>NEW IN THIS QUEST</small>'+chips(taught)+'</div>':'')+
   '<h3>BY THE END YOU CAN...</h3><ul class="lines">'+(q.outcomes||[]).map(o=>'<li>'+fmt(o)+'</li>').join('')+'</ul>'+
   '<div class="co say"><small>TOO MUCH?</small>Do just the next 3 screens (2 minutes). Starting is the hard part; momentum is free after that.</div>';
}
function sWarmup(b,q){
  const qi=q.n-1,need=new Set(conceptNeeds(q)),pool=[];
  QUESTS.slice(0,qi).forEach(p=>p.quiz.forEach(x=>pool.push(x)));
  const wp=[];pool.forEach(x=>{const a=S.ans[x.id];let k=a?(a.last===false?4:1):2;if((x.concepts||[]).some(c=>need.has(c)))k+=3;for(let j=0;j<k;j++)wp.push(x.id)});
  const pick=[];shuffle(wp).forEach(id=>{if(pick.length<3&&!pick.includes(id))pick.push(id)});
  gate(true);
  b.innerHTML='<h2>Warm-up: pull it from memory</h2><p class="mut">Three quick questions from earlier quests, picked because this quest leans on them. Remembering before you learn keeps old ideas alive. Wrong answers are fine here.</p><div id="wu"></div>';
  let i=0,ok=0;
  (function draw(){
    const box=$(b,'#wu');
    if(i>=pick.length){box.innerHTML='<div class="co keep" style="display:block"><small>WARM-UP DONE</small>'+ok+' of '+pick.length+' right. The new idea builds on exactly these.</div>';addXP(3+ok,'warm-up');gate(false);return}
    box.innerHTML='<p class="chip" style="display:inline-block;margin-bottom:10px">'+(i+1)+' / '+pick.length+'</p><div id="wq"></div>';
    bindQuiz($(box,'#wq'),BANK[pick[i]],good=>{if(good)ok++;i++;draw()});
  })();
}
function sFlow(b,q,s){
  const N=s.nodes||[];
  b.innerHTML='<h2>'+fmt(s.title)+'</h2>'+(s.intro?'<p>'+fmt(s.intro)+'</p>':'')+'<div class="flow">'+N.map((n,i)=>'<div class="fstep rv">'+(i?'<span class="arr"></span>':'')+'<div class="node" style="--c:var(--k'+(i%6)+')"><div class="nl">'+fmt(n.label)+'</div>'+(n.sub?'<div class="ns">'+fmt(n.sub)+'</div>':'')+'</div></div>').join('')+'</div>'+li(s.lines)+vizHtml(s.viz)+co('keep','KEEP THIS',s.keep)+co('trap','TRAP',s.trap);
}
function sCompare(b,q,s){
  const H=s.headers||['A','B'];
  b.innerHTML='<h2>'+fmt(s.title)+'</h2>'+(s.intro?'<p>'+fmt(s.intro)+'</p>':'')+'<div class="cmp"><div class="crow chd"><span></span><span>'+fmt(H[0])+'</span><span>'+fmt(H[1])+'</span></div>'+(s.rows||[]).map(r=>'<div class="crow rv"><span class="cl">'+fmt(r[0])+'</span><span>'+fmt(r[1])+'</span><span>'+fmt(r[2])+'</span></div>').join('')+'</div>'+co('keep','KEEP THIS',s.keep)+co('trap','TRAP',s.trap);
}

/* ---------- lab (sliders + live outputs + plot/svg) ---------- */
const MATHN=Object.getOwnPropertyNames(Math);
function compile(expr,names){
  const extra=MATHN.filter(n=>!names.includes(n));
  try{const f=new Function(...names,...extra,'return ('+expr+')');return vals=>{try{return f(...names.map(n=>vals[n]),...extra.map(n=>Math[n]))}catch(e){return NaN}}}catch(e){return()=>NaN}
}
function fnum(v,f){
  if(typeof v!=='number'||!isFinite(v))return '-';
  const loc=(x,d)=>x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  switch(f){case 'int':case '0':return loc(Math.round(v),0);case '1':return loc(v,1);case '2':return loc(v,2);case '3':return loc(v,3);
    case '$':return '$'+loc(v,2);case '$0':return '$'+loc(Math.round(v),0);case '%':return loc(v*100,1)+'%';case '%0':return loc(v*100,0)+'%';case 'sci':return v.toExponential(2);}
  const a=Math.abs(v);return a>=1000?loc(v,0):a>=100?loc(v,1):a>=1?loc(v,2):a===0?'0':v.toPrecision(3);
}
function sLab(b,q,s){
  const C=s.controls||[],names=C.map(c=>c.id);const vals={};C.forEach(c=>vals[c.id]=c.value!=null?c.value:c.min);
  const O=(s.outputs||[]).map(o=>Object.assign({},o,{fn:compile(o.expr,names)}));
  b.innerHTML='<h2>'+fmt(s.title)+'</h2>'+(s.intro?'<p>'+fmt(s.intro)+'</p>':'')+
   '<div class="lab"><div class="ctls">'+C.map(c=>'<div class="ctl"><label><span>'+fmt(c.label||c.id)+'</span><b data-v="'+c.id+'"></b></label><input type="range" data-id="'+c.id+'" min="'+c.min+'" max="'+c.max+'" step="'+(c.step||1)+'" value="'+vals[c.id]+'"></div>').join('')+
   '<div class="outs">'+O.map((o,i)=>'<div class="out"><span>'+fmt(o.label)+'</span><b data-o="'+i+'"></b></div>').join('')+'</div></div><div class="vizbox" id="lv"></div></div>'+
   (s.tries&&s.tries.length?'<h3 style="margin-top:12px">TRY THIS</h3><ul class="tries">'+s.tries.map(t=>'<li>'+fmt(t)+'</li>').join('')+'</ul>':'')+co('keep','KEEP THIS',s.keep);
  const lv=$(b,'#lv');
  const tpl=s.svg?String(s.svg).replace(/\{\{([^}]+)\}\}/g,(m,e)=>'{{'+e+'}}'):null;
  const tplFns=tpl?[...tpl.matchAll(/\{\{([^}]+)\}\}/g)].map(m=>[m[0],compile(m[1],names)]):[];
  const series=(s.plot&&s.plot.series||[]).map((p,i)=>Object.assign({color:['#e63946','#1f7fd1','#12213f'][i%3]},p,{fn:compile(p.expr,names.concat('x'))}));
  function draw(){
    C.forEach(c=>{$(b,'[data-v='+c.id+']').textContent=fnum(+vals[c.id],c.fmt||'')+(c.unit?' '+c.unit:'')});
    O.forEach((o,i)=>{$(b,'[data-o="'+i+'"]').textContent=fnum(o.fn(vals),o.fmt||'')+(o.unit?' '+o.unit:'')});
    let html='';
    if(tpl){let t=tpl;tplFns.forEach(([k,f])=>{const v=f(vals);t=t.split(k).join(isFinite(v)?(+v.toFixed(2)):0)});html+=t}
    if(series.length)html+=plotSvg(s.plot,series,vals,names);
    lv.innerHTML=html||'<p class="mut">Move the sliders.</p>';
  }
  $$(b,'input[type=range]').forEach(r=>r.oninput=()=>{vals[r.dataset.id]=+r.value;draw()});
  b._lab={C,O,vals,draw};draw();
}
function niceStep(raw){if(!(raw>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
function axisFmt(v){const a=Math.abs(v);const t=x=>String(+x.toFixed(2));if(a>=1e6)return t(v/1e6)+'M';if(a>=1e4)return t(v/1e3)+'k';if(a>=1e3&&v%1000===0)return t(v/1e3)+'k';return t(v)}
function plotSvg(P,series,vals,names){
  const W=640,H=320,L=64,B=44,T=16,Rr=18,x0=P.x[0],x1=P.x[1],N=80;
  const pts=series.map(se=>{const a=[];for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;const v=Object.assign({},vals,{x});a.push([x,se.fn(v)])}return a});
  let ymin=P.ymin!=null?P.ymin:Math.min(...pts.flat().map(p=>p[1]).filter(isFinite)),ymax=P.ymax!=null?P.ymax:Math.max(...pts.flat().map(p=>p[1]).filter(isFinite));
  if(!isFinite(ymin)||!isFinite(ymax)||ymin===ymax){ymin=0;ymax=1}if(P.ymin==null&&ymin>0&&ymin<ymax*.3)ymin=0;
  const stp=niceStep((ymax-ymin)/4);if(P.ymin==null)ymin=Math.floor(ymin/stp)*stp;if(P.ymax==null)ymax=Math.ceil(ymax/stp)*stp;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-Rr),sy=y=>H-B-(y-ymin)/(ymax-ymin)*(H-B-T);
  let g='';
  for(let yv=ymin;yv<=ymax+stp*.001;yv+=stp){const y=sy(yv);g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-Rr)+'" y2="'+y+'" stroke="#c4e8ff" stroke-width="2"/><text x="'+(L-8)+'" y="'+(y+5)+'" text-anchor="end" font-size="15" font-family="monospace" fill="#40527a">'+axisFmt(yv)+'</text>'}
  for(let i=0;i<=4;i++){const xv=x0+(x1-x0)*i/4,x=sx(xv);g+='<text x="'+x+'" y="'+(H-B+22)+'" text-anchor="middle" font-size="15" font-family="monospace" fill="#40527a">'+axisFmt(xv)+'</text>'}
  g+='<rect x="'+L+'" y="'+T+'" width="'+(W-L-Rr)+'" height="'+(H-B-T)+'" fill="none" stroke="#12213f" stroke-width="3"/>';
  series.forEach((se,k)=>{g+='<polyline fill="none" stroke="'+se.color+'" stroke-width="4" stroke-linejoin="round" points="'+pts[k].filter(p=>isFinite(p[1])).map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')+'"/>';
    if(P.at&&vals[P.at]!=null){const xv=Math.min(x1,Math.max(x0,vals[P.at])),yv=se.fn(Object.assign({},vals,{x:xv}));if(isFinite(yv))g+='<rect x="'+(sx(xv)-7)+'" y="'+(sy(yv)-7)+'" width="14" height="14" fill="'+se.color+'" stroke="#12213f" stroke-width="3"/>'}
    if(series.length>1&&se.label)g+='<rect x="'+(L+10)+'" y="'+(T+8+k*22)+'" width="14" height="14" fill="'+se.color+'"/><text x="'+(L+30)+'" y="'+(T+20+k*22)+'" font-size="15" font-family="monospace" fill="#12213f">'+esc(se.label)+'</text>'});
  if(P.at&&vals[P.at]!=null){const xx=sx(Math.min(x1,Math.max(x0,vals[P.at])));g+='<line x1="'+xx+'" y1="'+T+'" x2="'+xx+'" y2="'+(H-B)+'" stroke="#e63946" stroke-width="2" stroke-dasharray="6 5"/>'}
  g+=(P.xlabel?'<text x="'+((L+W-Rr)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="16" font-family="monospace" fill="#12213f">'+esc(P.xlabel)+'</text>':'')+(P.ylabel?'<text transform="translate(14 '+((T+H-B)/2)+') rotate(-90)" text-anchor="middle" font-size="16" font-family="monospace" fill="#12213f">'+esc(P.ylabel)+'</text>':'');
  return '<svg class="plot" viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
}

function quizHtml(Qn){
  const opts=shuffle([Qn.answer].concat(Qn.wrong||[]));Qn._o=opts;
  return (Qn.tag?'<div class="chips"><span class="chip b">'+esc(Qn.tag)+'</span></div>':'')+'<h2 class="qq" style="font-family:var(--body)">'+fmt(Qn.q)+'</h2><div class="opts">'+opts.map((t,i)=>'<button class="opt" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+fmt(t)+'</span></button>').join('')+'</div><div class="fb"></div>';
}
function bindQuiz(box,Qn,onDone){
  box.innerHTML=quizHtml(Qn);const ai=Qn._o.indexOf(Qn.answer);let locked=false;
  box._correct=ai;box._pick=i=>{const b=$(box,'.opt[data-i="'+i+'"]');b&&b.click()};
  $$(box,'.opt').forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;const i=+b.dataset.i,ok=i===ai;
    $$(box,'.opt').forEach((x,k)=>{x.disabled=true;if(k===ai)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
    const r=S.ans[Qn.id]||{n:0,c:0,first:false};r.n++;if(ok)r.c++;if(r.n===1)r.first=ok;const wasMiss=r.last===false;r.last=ok;S.ans[Qn.id]=r;
    if(ok){S.combo++;S.best=Math.max(S.best,S.combo);SND.ok();award('first');if(S.combo>=5)award('combo5');addXP(r.n===1?10:4,r.n===1?'first try'+(S.combo>=3?'  COMBO x'+S.combo:''):'got it this time')}
    else{S.combo=0;SND.bad()}
    save();renderHud();
    $(box,'.fb').innerHTML='<div class="verdict '+(ok?'ok':'bad')+'">'+(ok?'CORRECT!':'NOT QUITE. ANSWER: '+'ABCD'[ai])+'</div><div class="why">'+fmt(Qn.why||'')+'</div>'+(ok?'':'<p class="mut sm">Saved to your retry list. Wrong answers are where learning happens.</p>')+(onDone?'<button class="btn" data-k="nx">NEXT QUESTION</button>':'');
    if(onDone){$(box,'[data-k=nx]').onclick=()=>onDone(ok)}else gate(false);
  });
}

/* ---------- raid (boss) + retry ---------- */
function pickRaid(n){
  const ids=Object.keys(BANK);const pool=[];
  ids.forEach(id=>{const a=S.ans[id];const w=a?(a.last===false?4:1):2;for(let j=0;j<w;j++)pool.push(id)});
  const out=[],seen=new Set();
  for(const id of shuffle(pool)){if(seen.has(id))continue;seen.add(id);out.push(id);if(out.length>=n)break}
  for(let i=1;i<out.length;i++)if(BANK[out[i]].quest===BANK[out[i-1]].quest)for(let j=i+1;j<out.length;j++)if(BANK[out[j]].quest!==BANK[out[i-1]].quest){[out[i],out[j]]=[out[j],out[i]];break}
  return out;
}

  }
}
function runQuiz(el,ids,mode){
  const queue=ids.slice(),total=ids.length;let done=0,okFirst=0;const byQ={},seen=new Set();
  function draw(){
    if(!queue.length){
      const acc=Math.round(100*okFirst/total);S.raids+=mode==='raid'?1:0;
      const bonus=mode==='raid'?(acc>=80?30:10):5;addXP(bonus,mode==='raid'?'raid clear':'retry done');
      if(mode==='raid'&&acc>=80){award('boss');confetti(60)}
      if(mode==='retry'&&!missIds().length)award('comeback');
      const rows=Object.keys(byQ).map(k=>{const qq=QUESTS[qIdx(k)];return '<div class="out"><span>'+esc(qq.title)+'</span><b>'+byQ[k][0]+' / '+byQ[k][1]+'</b></div>'}).join('');
      el.innerHTML='<div class="sprites" style="justify-content:flex-start">'+icon('trophy',6)+'</div><div class="big2">'+acc+'%</div><p>'+okFirst+' of '+total+' right on the first try. '+(acc>=85?'Exam-ready on these.':acc>=65?'Solid. Retry the misses and you are there.':'Good data. Your retry list now shows exactly what to study.')+'</p><div class="outs" style="margin:12px 0">'+rows+'</div><div class="row"><button class="btn" data-k="a">'+(mode==='raid'?'RAID AGAIN':'BACK')+'</button><button class="btn ghost" data-k="m">BACK TO THE MAP</button></div>';
      $(el,'[data-k=a]').onclick=()=>mode==='raid'?raidMenu('raid'):go({v:'map'});$(el,'[data-k=m]').onclick=()=>go({v:'map'});return;
    }
    const id=queue.shift(),Qn=BANK[id];
    const hp=Array.from({length:total},(_,i)=>'<i class="'+(i<done?'lost':'')+'"></i>').join('');
    el.innerHTML='<div class="boss">'+(mode==='raid'?icon('boss',4):icon('flag',4))+'<div class="hp" title="Boss HP">'+hp+'</div><span class="chip">'+(done+1)+' / '+total+'</span></div><div id="rq"></div>';
    bindQuiz($(el,'#rq'),Qn,good=>{
      byQ[Qn.quest]=byQ[Qn.quest]||[0,0];
      if(!seen.has(id)){seen.add(id);byQ[Qn.quest][1]++;if(good){okFirst++;byQ[Qn.quest][0]++}}
      if(good){done++}else if(!queue.includes(id)&&mode==='raid'&&!Qn._requeued){Qn._requeued=true;queue.push(id)}else{done++}
      draw();
    });
  }
  draw();
}

/* ---------- keys + touch ---------- */
addEventListener('keydown',e=>{
  const tg=e.target;if(['TEXTAREA','INPUT'].includes(tg.tagName)&&tg.type!=='checkbox'&&tg.type!=='range'){if(e.key==='Escape'){const t=topOverlay();t&&t.remove()}return}
  const k=e.key;
  if(k==='Escape'){const t=topOverlay();if(t){t.remove();return}}
  if(topOverlay()){const t=topOverlay();if(t.classList.contains('lvlov')){t.remove();e.preventDefault()}return}
  if(k==='g'||k==='G'){glToggle(true);return}
  if(k==='h'||k==='H'){go({v:'map'});return}
  if(k==='r'||k==='R'){go({v:'review'});return}
  if(k==='t'||k==='T'){tToggle();return}
  if(k==='m'||k==='M'){S.sfx=!S.sfx;save();toast('Sound '+(S.sfx?'on':'off'));SND.ok();return}
  const qz=$(root,'.opts');
  if(qz&&!$(root,'.opt[disabled]')){const idx='abcd'.indexOf(k.toLowerCase()),n=/^[1-4]$/.test(k)?+k-1:idx;if(n>=0&&n<4){const box=qz.parentElement;box._pick&&box._pick(n);return}}
  if(V.v!=='quest')return;
  if(['ArrowRight','PageDown'].includes(k)||((k===' '||k==='Enter')&&!['BUTTON'].includes(tg.tagName))){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp'].includes(k)){e.preventDefault();prev()}
});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null||V.v!=='quest')return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>90&&!e.target.closest('input,textarea,.lab'))(d<0?next():prev());tx=null});

/* ---------- selftest: render every step, check for exceptions ---------- */
function selftest(){
  const errs=[];let n=0;
  QUESTS.forEach((q,qi)=>q.steps.forEach((s,i)=>{try{V={v:'quest',q:qi,i};rQuest();n++;
    if(s.t==='lab'){const L=$(root,'#body')._lab;L.O.forEach((o,k)=>{if(!isFinite(o.fn(L.vals)))errs.push('Q'+q.n+' step '+(i+1)+': output "'+o.label+'" is not a finite number at default values')})}
    if(!root.textContent.trim())errs.push('Q'+q.n+' step '+(i+1)+': empty')}catch(e){errs.push('Q'+q.n+' step '+(i+1)+' ('+s.t+'): '+e.message)}}));
  ['map','review'].forEach(v=>{try{go({v});n++}catch(e){errs.push(v+': '+e.message)}});
  const pre=document.createElement('pre');pre.id='selftest';pre.textContent=(errs.length?'FAIL '+errs.join(' | '):'OK '+n+' screens')+'';document.body.appendChild(pre);
}

/* ---------- start ---------- */
renderHud();
if(/[?&]reveal/.test(location.search))document.body.classList.add('static');
if(/[?&]selftest/.test(location.search)){selftest()}
else{
  const m=location.hash.match(/^#q(\d+)\/(\d+)$/);
  if(m&&QUESTS[+m[1]-1])go({v:'quest',q:+m[1]-1,i:Math.max(0,Math.min(QUESTS[+m[1]-1].steps.length-1,+m[2]-1))});
  else if(location.hash==='#map')go({v:'map'});
  else go({v:'title'});
}
})();
